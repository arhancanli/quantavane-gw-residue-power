# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Gallai–van der Waerden numbers from m-th power residue colourings"
  description: >-
    A Lean 4 and Mathlib proof of two lower-bound constructions for the Gallai–van der Waerden
    numbers GW(r; k, l) of Mao, Ozeki, Robertson and Wang (the least M such that for every n ≥ M,
    every exact r-colouring of {1, …, n} contains a rainbow k-term or a monochromatic l-term
    arithmetic progression), for rainbow (m + 1)-term progressions and every m. Let p > l ≥ 2 be a
    prime with p ≡ 1 (mod m) such that (i) for every i in {0, …, m} the m residues j − i
    (j ≠ i, 0 ≤ j ≤ m) do not lie in m distinct m-th power classes modulo p, and (ii) no l
    consecutive integers in [1, p − 1] lie in one class. Theorem 4: colouring x in [1, (l − 1)p]
    by (x − 1)^((p − 1)/m) mod p (the m-th power class of x − 1, and a new colour 0 on the zero
    class x ≡ 1 (mod p)) uses exactly m + 1 colours and has no rainbow (m + 1)-term and no
    monochromatic l-term progression, so GW(m + 1; m + 1, l) > (l − 1)p. Theorem 8: if instead the
    zero class 1 + kp (0 ≤ k ≤ l − 1) of [1, (l − 1)p + 1] is coloured by s ≥ 2 new colours z(k),
    where z uses all s colours and has no rainbow (m + 1)-term progression, the colouring uses
    exactly m + s colours and is good, so GW(m + s; m + 1, l) > (l − 1)p + 1. The formalization
    proves both theorems for every such m, l, p (and s, z), the resulting bounds for GW
    (unconditionally for every threshold with the defining property, and for the number itself
    given that a threshold exists), and five instances with l = 4: GW(4; 4, 4) > 327,
    GW(5; 5, 4) > 1059, GW(6; 6, 4) > 2253, GW(6; 4, 4) > 328 and GW(8; 5, 4) > 1060.
  authors:
    - "Arhan Canli"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arhan Canli"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["05D10", "11B25", "11A15"]

sources:
  - title: >-
      m-th power residue colourings give GW(m + 1; m + 1, l) > (l − 1)p and, with a split zero
      class, GW(m + s; m + 1, l) > (l − 1)p + 1 (Theorems 4 and 8 of Quantavane's note on
      Gallai–van der Waerden numbers, 11–12 November 2026)
    type: original-proof
    relationship: other
    contributors:
      - name: "Claude (Anthropic)"
        role: >-
          AI agents working under Arhan Canli's direction: found the constructions, wrote the
          informal proofs and the Lean proof, and ran the mechanical checks
    note: >-
      First presented in this repository; an unpublished internal note of Quantavane has the same
      statements and informal proofs (Theorem 4 with m ≥ 2, l ≥ 4; Theorem 8 with m ≥ 2, l ≥ 3; the
      Lean statements assume l ≥ 2 and contain these cases). A literature search on 11 November 2026
      (MORW 2023, Si 2026 and two web searches) found no earlier construction of this kind and no
      published value of a Gallai–van der Waerden number with l ≥ 4. The search was limited, so
      novelty is not established beyond it.
  - title: "Arithmetic progressions, quasi progressions, and Gallai-Ramsey colorings"
    authors:
      - "Yaping Mao"
      - "Kenta Ozeki"
      - "Aaron Robertson"
      - "Zhao Wang"
    id: "doi:10.1016/j.jcta.2022.105672"
    type: paper
    location: "J. Combin. Theory Ser. A 193 (2023), 105672; Definition 1.15 (Gallai–van der Waerden numbers)"
    relationship: background
    note: >-
      Introduces the Gallai–van der Waerden numbers GW(r; k, l). The definitions
      IsGoodExactColouring, GWProperty and GW in Challenge.lean follow Definition 1.15. The paper
      gives values and bounds for l = 3 and asymptotic bounds, but no value for l ≥ 4.
    author_endorsement: not-contacted
  - title: "Some progression-free partitions constructed using Folkman's method"
    authors:
      - "John R. Rabung"
    id: "doi:10.4153/CMB-1979-012-1"
    type: paper
    location: "Canad. Math. Bull. 22 (1979), 87–91"
    relationship: background
    note: >-
      Power-residue colourings as lower-bound constructions for van der Waerden numbers. The
      residue part of powerColour and splitColour (the m-th power class of x − 1) is this classical
      idea; the zero-class colours, condition (i) and the Gallai (rainbow) setting are what
      Theorems 4 and 8 add.
    author_endorsement: not-contacted
  - title: "Improving the Use of Cyclic Zippers in Finding Lower Bounds for van der Waerden Numbers"
    authors:
      - "John Rabung"
      - "Mark Lotts"
    id: "doi:10.37236/2363"
    type: paper
    location: "Electron. J. Combin. 19(2) (2012), #P35"
    relationship: background
    note: "Later development of residue-based lower bounds for van der Waerden numbers."
    author_endorsement: not-contacted
  - title: "Complete Determination of the Gallai-van der Waerden Number GW(r;3,3)"
    authors:
      - "Yuan Si"
    id: "arXiv:2610.30711"
    type: paper
    location: "https://arxiv.org/abs/2610.30711 (October 2026)"
    relationship: background
    note: >-
      Determines GW(r; 3, 3) for every r; the instances of this formalization have l = 4. Y. Si has
      not reviewed this repository.
    author_endorsement: other

related_formalizations:
  - id: "https://github.com/arhancanli/quantavane-gw-residue/tree/be8cde77420f724366fb292451866c2ee931a5dc"
    relationship: other
    note: >-
      Quantavane's formalization of the quadratic-residue construction (Theorem 1 of the same note,
      GW(s + 2; 3, l) > (l − 1)p + 1 for p ≡ 1 (mod 8)). Mathematically it is the case m = 2 of
      Theorem 8 here, where condition (i) says (2 | p) = (−1 | p) = 1. The two repositories use
      different encodings (Legendre symbols and colours Fin (s + 2) there; power classes in ZMod p
      here) and neither imports the other.

status:
  scope: >-
    Formalized: Theorem 4 (parts (a) exactly m + 1 colours, (b) no rainbow (m + 1)-term
    progression, (c) no monochromatic l-term progression on [1, (l − 1)p], for the colouring
    powerColour p m) and Theorem 8 (the same three parts with m + s colours on [1, (l − 1)p + 1],
    for the colouring splitColour p m s z) for every l ≥ 2, every m, every prime p > l with
    p ≡ 1 (mod m) satisfying conditions (i) and (ii), and (for Theorem 8) every s ≥ 2 and every
    z : ℕ → Fin s that takes all s values on {0, …, l − 1} with no rainbow (m + 1)-term progression
    there; the existence of good exact colourings with colours Fin (m + 1) and Fin (m + s); the
    bounds (l − 1)p < M and (l − 1)p + 1 < M for every M with the defining property of
    GW(m + 1; m + 1, l) and GW(m + s; m + 1, l); the bounds for the numbers GW themselves under the
    hypothesis that some threshold exists; and five instances with l = 4 ((m, p) = (3, 109),
    (4, 353), (5, 751) for Theorem 4; (m, p, z) = (3, 109, 0120), (4, 353, 0123) for Theorem 8).
    Not formalized: the Gallai–van der Waerden theorem (that a threshold exists), which lt_GW and
    lt_GW_split take as the hypothesis hex; which primes satisfy (i) and (ii) in general (the
    internal note uses Weil's bound and a computer search for that); exact values of any GW
    number; optimality of the bounds.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        AI agents in Claude Code with shell access to a local Lean toolchain and Mathlib, working
        under Arhan Canli's direction: Quantavane's coordinating agent found Theorem 4 and wrote its
        informal proof; two further agents found Theorem 6 (the cubic case of Theorem 8) and
        Theorem 8 and wrote their informal proofs; another agent wrote the Lean proof in this
        repository (Lean v4.35.0, module system, Challenge/Solution layout) and ran the checks.
      cost:
        wall_time: "about two days (11–12 November 2026), the Lean proof itself about two hours"
        spend_usd: "subscription-based usage, not tracked per project"
        hardware: "a local Mac (Apple silicon)"
      prompting_notes: >-
        The agents were asked for new mathematics on Gallai–van der Waerden numbers, then for a
        Lean proof of the general m-th power theorem with only the standard axioms, packaged for
        Palomar like Quantavane's earlier quadratic-residue repository.
  spend_usd: "subscription-based usage, not tracked per project"
  notes: >-
    The mathematics, the informal proofs and every line of Lean in this repository were written by
    AI agents (Claude, by Anthropic). Arhan Canli directed the work and is responsible for the
    result.

fidelity:
  divergences: >-
    None known with respect to MORW Definition 1.15. The note states Theorem 4 for m ≥ 2, l ≥ 4 and
    Theorem 8 for m ≥ 2, l ≥ 3; the Lean statements have no hypothesis on m (p % m = 1 with p prime
    forces m ≥ 2) and assume only l ≥ 2, so they contain the note's statements. Lean conventions
    to note: colourings are functions on ℕ whose values outside [1, n] are ignored; the colours of
    powerColour are elements of ZMod p (the m classes and 0) and those of splitColour elements of
    ZMod p ⊕ Fin s, and "exactly r colours" is stated as the cardinality of the image of [1, N];
    the corollaries relabel these values as Fin r; z is a function on ℕ whose values outside
    {0, …, l − 1} play no role; GW uses sInf, which is 0 for the empty set, so lt_GW and
    lt_GW_split assume that some threshold exists, while the threshold forms and the instances do
    not.

review:
  status: "self-assessed"
  reviewers:
    - "the agent that wrote the Lean proof (Claude, Anthropic)"
  notes: >-
    The agent that wrote the Lean proof compared the Lean statements with the note's statements,
    printed the axioms of every compared theorem (propext, Classical.choice, Quot.sound), checked
    that the declarations the thirteen compared statements depend on (including the seven
    definitions) are identical in the Challenge and Solution environments, and replayed the
    exported Solution through Lean's kernel, leanchecker-paranoid, NanoDa, lean4lean, con-leche and
    con-ron. Lake's comparator needs bubblewrap and was not run locally (macOS); Palomar's
    preflight workflow runs it. No other agent and no mathematician outside Quantavane has
    reviewed the proof.

alignment:
  namespace: "GwPower"
  statements:
    - source: "Theorem 4, parts (a), (b), (c)"
      lean: "GwPower.theorem4"
      module: "Challenge"
      status: proved
      note: "Hypotheses hl (l ≥ 2), hlp, hpm (p % m = 1), hi (condition (i)), hii (condition (ii))."
    - source: "Corollary of Theorem 4: a good exact (m + 1)-colouring of [1, (l − 1)p] exists"
      lean: "GwPower.exists_goodExactColouring"
      module: "Challenge"
      status: proved
      note: "Witnessed by powerColour p m, relabelled as Fin (m + 1)."
    - source: "Theorem 4: GW(m + 1; m + 1, l) > (l − 1)p, threshold form"
      lean: "GwPower.lt_of_gwProperty"
      module: "Challenge"
      status: proved
      note: "Every M with GWProperty (m + 1) (m + 1) l M exceeds (l − 1)p; no existence assumption."
    - source: "Theorem 4: GW(m + 1; m + 1, l) > (l − 1)p for the number GW"
      lean: "GwPower.lt_GW"
      module: "Challenge"
      status: proved
      note: "Assumes that some M has the GW property (the Gallai–van der Waerden theorem, not formalized here)."
    - source: "Theorem 8, parts (a), (b), (c)"
      lean: "GwPower.theorem8"
      module: "Challenge"
      status: proved
      note: "Further hypotheses hs (s ≥ 2), hz (z takes all s values on {0, …, l − 1}), hzk (no rainbow (m + 1)-term progression under z there)."
    - source: "Corollary of Theorem 8: a good exact (m + s)-colouring of [1, (l − 1)p + 1] exists"
      lean: "GwPower.exists_goodExactColouring_split"
      module: "Challenge"
      status: proved
      note: "Witnessed by splitColour p m s z, relabelled as Fin (m + s)."
    - source: "Theorem 8: GW(m + s; m + 1, l) > (l − 1)p + 1, threshold form"
      lean: "GwPower.lt_of_gwProperty_split"
      module: "Challenge"
      status: proved
      note: "No existence assumption."
    - source: "Theorem 8: GW(m + s; m + 1, l) > (l − 1)p + 1 for the number GW"
      lean: "GwPower.lt_GW_split"
      module: "Challenge"
      status: proved
      note: "Assumes that some M has the GW property."
    - source: "Instance of Theorem 4, (m, l, p) = (3, 4, 109): GW(4; 4, 4) > 327"
      lean: "GwPower.gw_4_4_4"
      module: "Challenge"
      status: proved
      note: "Threshold form; conditions (i) and (ii) checked by decide."
    - source: "Instance of Theorem 4, (m, l, p) = (4, 4, 353): GW(5; 5, 4) > 1059"
      lean: "GwPower.gw_5_5_4"
      module: "Challenge"
      status: proved
      note: "Threshold form; condition (ii) checked by decide +kernel."
    - source: "Instance of Theorem 4, (m, l, p) = (5, 4, 751): GW(6; 6, 4) > 2253"
      lean: "GwPower.gw_6_6_4"
      module: "Challenge"
      status: proved
      note: "Threshold form; condition (ii) checked by decide +kernel."
    - source: "Instance of Theorem 8, (m, l, p) = (3, 4, 109), z = 0, 1, 2, 0: GW(6; 4, 4) > 328"
      lean: "GwPower.gw_6_4_4"
      module: "Challenge"
      status: proved
      note: "Threshold form."
    - source: "Instance of Theorem 8, (m, l, p) = (4, 4, 353), z = 0, 1, 2, 3: GW(8; 5, 4) > 1060"
      lean: "GwPower.gw_8_5_4"
      module: "Challenge"
      status: proved
      note: "Threshold form."

acknowledgements: >-
